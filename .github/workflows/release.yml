name: Build Obsidian plugin

on:
  push:
    tags:
      - "*" # Any tag, e.g. 1.4.0

env:
  PLUGIN_NAME: obsidian-vale # Plugin id folder name

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Enable Corepack
        run: corepack enable
      - name: Build
        run: |
          yarn install --immutable
          yarn run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file <(awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md) \
            "${{ env.PLUGIN_NAME }}-$TAG.zip" main.js manifest.json styles.css
